name: Weekly database backup

# Dumps the database, encrypts it with BACKUP_PASSPHRASE (AES-256) and keeps it
# as a workflow artifact for 90 days; optionally also pushes it to a PRIVATE
# repository. Never stores an unencrypted backup. See docs/SETUP_SUPABASE.md.
on:
  schedule:
    - cron: '23 4 * * 0' # Sundays, 12:23 Taiwan time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
      BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::SUPABASE_DB_URL / BACKUP_PASSPHRASE secrets are not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump and encrypt
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          PG=/usr/lib/postgresql/17/bin
          STAMP=$(date -u +%Y%m%d)
          mkdir -p work
          $PG/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --format=custom -f work/public.dump
          $PG/psql "$DB_URL" -v ON_ERROR_STOP=1 -c "\copy (select id, email, created_at, raw_user_meta_data from auth.users) to 'work/auth_users.csv' csv header"
          tar czf work.tgz -C work .
          echo "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "db-backup-$STAMP.tgz.gpg" work.tgz
          shred -u work.tgz work/* && rmdir work
          ls -la db-backup-*.gpg

      - name: Keep as an artifact (90 days)
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: db-backup-*.tgz.gpg
          retention-days: 90

      - name: Push to a private backup repository (optional)
        if: steps.check.outputs.skip != 'true' && env.BACKUP_REPO != '' && env.BACKUP_REPO_TOKEN != ''
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" target
          cp db-backup-*.tgz.gpg target/
          cd target
          # Keep the 26 most recent backups (about six months).
          ls -1 db-backup-*.tgz.gpg | sort | head -n -26 | xargs -r git rm -q
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add db-backup-*.tgz.gpg
          git commit -qm "backup $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push -q
