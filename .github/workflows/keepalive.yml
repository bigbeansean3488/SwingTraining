name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. This calls a
# tiny database function once a day. Secrets: see docs/SETUP_SUPABASE.md.
on:
  schedule:
    - cron: '17 3 * * *' # daily, 11:17 Taiwan time
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secrets are not set yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' \
            -o /dev/null -w "HTTP %{http_code}\n"

      # GitHub disables scheduled workflows in public repositories after 60 days
      # without repository activity. Re-enabling them through the API resets that.
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in keepalive.yml backup.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || echo "could not re-enable $wf"
          done
