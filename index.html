<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="data:," />
  <meta name="theme-color" content="#0b0d10" />
  <title>SwingTraining</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">SwingTraining</span>
    <button type="button" class="session-chip" id="session-menu-btn" hidden aria-haspopup="dialog">
      <span id="session-chip-text"></span><span aria-hidden="true" class="dots">⋯</span>
    </button>
  </header>

  <main id="main">
    <p class="banner error" id="app-error" role="alert" hidden></p>

    <!-- 訓練：Setup (no session) or Practice (active session) -->
    <section id="view-setup" class="view" aria-label="開始訓練" hidden></section>

    <section id="view-practice" class="view" aria-label="訓練" hidden>
      <div id="practice-status" aria-live="polite" hidden></div>

      <div id="video-panel" class="card video-card" hidden>
        <div class="stage" id="stage">
          <video id="video" playsinline muted controls preload="auto"></video>
          <canvas id="overlay"></canvas>
        </div>
        <p class="muted small" id="video-meta"></p>
        <div id="range-block" hidden>
          <button type="button" class="btn btn-primary btn-lg" id="analyze-here">分析這個位置的 Swing</button>
          <details class="adv">
            <summary>進階：手動設定秒數</summary>
            <div class="range-row">
              <label class="field"><span>開始（秒）</span><input id="range-start" type="number" min="0" step="0.1" inputmode="decimal" /></label>
              <label class="field"><span>結束（秒）</span><input id="range-end" type="number" min="0" step="0.1" inputmode="decimal" /></label>
            </div>
            <button type="button" class="btn btn-secondary" id="analyze-btn">用這段時間分析</button>
          </details>
        </div>
      </div>

      <div id="practice-result"></div>
      <div id="practice-recent"></div>
    </section>

    <section id="view-review" class="view" aria-label="紀錄" hidden></section>
    <section id="view-settings" class="view" aria-label="設定" hidden></section>
  </main>

  <!-- Primary practice action, always reachable at the bottom -->
  <div class="action-bar" id="action-bar" hidden>
    <label class="btn btn-primary btn-xl next-btn" id="next-btn" role="button" tabindex="0">
      <span id="next-btn-text">＋ 下一棒</span>
      <input id="video-input" type="file" accept="video/*" class="visually-hidden" tabindex="-1" />
    </label>
  </div>

  <nav class="tabbar" aria-label="主要頁面">
    <button type="button" class="tab" data-tab="train" aria-current="page"><span aria-hidden="true">⚾</span>訓練</button>
    <button type="button" class="tab" data-tab="review"><span aria-hidden="true">▤</span>紀錄</button>
    <button type="button" class="tab" data-tab="settings"><span aria-hidden="true">⚙</span>設定</button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="dialog" class="dialog-host" hidden></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
