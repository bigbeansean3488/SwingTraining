<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:," />
  <meta name="theme-color" content="#111418" />
  <title>SwingTraining</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>SwingTraining</h1>
    <span class="version" id="app-version"></span>
  </header>

  <main id="app">
    <section class="card">
      <label class="btn primary file-btn">
        Select / record swing video
        <input id="video-input" type="file" accept="video/*" hidden />
      </label>
      <p class="error" id="video-error" hidden></p>
    </section>

    <section class="card" id="video-card" hidden>
      <div class="stage">
        <video id="video" playsinline muted controls preload="auto"></video>
        <canvas id="overlay"></canvas>
      </div>
      <dl class="meta" id="video-meta"></dl>

      <div class="controls">
        <label>From <input id="range-start" type="number" min="0" step="0.1" inputmode="decimal" /> s</label>
        <label>To <input id="range-end" type="number" min="0" step="0.1" inputmode="decimal" /> s</label>
        <label>Model
          <select id="model-variant">
            <option value="lite">lite (fast)</option>
            <option value="full" selected>full</option>
            <option value="heavy">heavy (slow)</option>
          </select>
        </label>
      </div>
      <button class="btn primary file-btn" id="analyze-btn">Analyze pose</button>
      <progress id="analyze-progress" max="1" value="0" hidden></progress>
      <p class="muted small" id="analyze-status"></p>
      <dl class="meta" id="tracking-summary"></dl>
    </section>

    <section class="card">
      <p class="muted small" id="env-status">Checking environment…</p>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
